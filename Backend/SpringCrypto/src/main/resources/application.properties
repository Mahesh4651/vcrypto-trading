# ──────────────────────────────────────────
# PostgreSQL — overridden by Docker env vars
# ──────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vcrypt_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ──────────────────────────────────────────
# Server
# ──────────────────────────────────────────
server.port=${SERVER_PORT:8081}

# ──────────────────────────────────────────
# CORS — frontend origin injected via env
# ──────────────────────────────────────────
frontend.url=${FRONTEND_URL:http://localhost}

# ──────────────────────────────────────────
# HikariCP connection pool
# ──────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=20000

# ──────────────────────────────────────────
# Logging
# ──────────────────────────────────────────
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.jdbc.datasource=WARN
logging.level.org.springframework.boot.autoconfigure.jdbc=WARN
